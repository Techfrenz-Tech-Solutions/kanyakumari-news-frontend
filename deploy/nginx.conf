# nginx server block — Kanyakumari Today
# =============================================================================
# This file replaces the Netlify _redirects file. Since the site is served by
# nginx (not Netlify), _redirects is ignored. Deploy this config to your nginx
# sites-available directory and reload nginx.
#
# USAGE:
#   1. Copy to /etc/nginx/sites-available/kanyakumaritoday.com
#   2. symlnk: ln -s /etc/nginx/sites-available/kanyakumaritoday.com /etc/nginx/sites-enabled/
#   3. Test:   nginx -t
#   4. Reload: systemctl reload nginx
#
# ADJUST these values for your server:
#   - ssl_certificate / ssl_certificate_key paths
#   - root path (must point to the deployed dist/ directory)
#   - proxy_pass backend URL/port (currently 127.0.0.1:3000)
# =============================================================================

# ── HTTP → HTTPS redirect (non-www) ───────────────────────────────────────────
server {
    listen 80;
    server_name kanyakumaritoday.com www.kanyakumaritoday.com;
    return 301 https://www.kanyakumaritoday.com$request_uri;
}

# ── HTTPS non-www → www redirect ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name kanyakumaritoday.com;

    # TODO: set your SSL certificate paths
    ssl_certificate     /etc/letsencrypt/live/kanyakumaritoday.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kanyakumaritoday.com/privkey.pem;

    return 301 https://www.kanyakumaritoday.com$request_uri;
}

# ── Main server block ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name www.kanyakumaritoday.com;

    # TODO: set your SSL certificate paths
    ssl_certificate     /etc/letsencrypt/live/kanyakumaritoday.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kanyakumaritoday.com/privkey.pem;

    # TODO: set this to the path where your built dist/ is deployed
    root /var/www/kanyakumaritoday/dist;
    index index.html;

    # ── Static SEO files (must come BEFORE the SPA fallback) ───────────────────
    # These are served directly by nginx so they never reach the backend.

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /news-sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=1800";
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /feed.xml {
        default_type application/rss+xml;
        add_header Cache-Control "public, max-age=1800";
    }

    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    location = /logo.png {
        # logo is also referenced in JSON-LD — serve with long cache
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── 301 redirects ──────────────────────────────────────────────────────────
    # These replace the Netlify _redirects rules that nginx ignores.

    location = /index.html {
        return 301 https://www.kanyakumaritoday.com/;
    }

    location = /category/tamil-nadu {
        return 301 https://www.kanyakumaritoday.com/category/tamilnadu-news;
    }

    # ── API proxy ───────────────────────────────────────────────────────────────
    # Proxy /api/ and /uploads/ to the backend. Never expose the backend URL.
    # TODO: set the backend host:port (currently 127.0.0.1:3000)

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static build assets (JS, CSS, images) ──────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback (must be LAST) ────────────────────────────────────────────
    # Any path not matched above tries the file, then falls back to index.html
    # so react-router can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/xml application/javascript text/xml application/rss+xml;
    gzip_min_length 1000;
    gzip_vary on;
}
